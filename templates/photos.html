{% extends "base.html" %}
{% set active='photos' %}
{% block title %}Foto — TG Drive{% endblock %}
{% block content %}
<div class="toolbar">
  <div class="tools">
    <select id="psort">
      <option value="taken-desc">Terbaru dulu</option>
      <option value="taken-asc">Terlama dulu</option>
      <option value="date-desc">Upload terbaru</option>
      <option value="size-desc">Ukuran terbesar</option>
      <option value="size-asc">Ukuran terkecil</option>
      <option value="name-asc">Nama A–Z</option>
    </select>
    <button class="btn ghost" id="favToggle">★ Favorit</button>
    <div class="seg" id="pview">
      <button data-v="grid" class="on" title="Grid nyaman">▦</button>
      <button data-v="compact" title="Grid rapat">▤</button>
      <button data-v="list" title="Daftar">☰</button>
    </div>
  </div>
</div>
<div id="lockNote" class="locknote hidden"></div>
<div id="timeline"></div>
<div id="emptyState" class="empty hidden">Belum ada foto atau video.<br>Upload lewat halaman Drive.</div>
{% endblock %}
{% block scripts %}
<script>initPhotos();</script>
{% endblock %}
